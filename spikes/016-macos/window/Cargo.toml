# Spike 016 (research M-18): wry on Fallow's own NSWindow. Throwaway.
# Its own workspace so it never joins the product build.
[workspace]
resolver = "3"

[package]
name = "mac-window-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
fallow = { path = "../../.." }
serde_json = "1"
wry = "=0.57.2"
raw-window-handle = "0.6"
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSDate", "NSRunLoop", "NSObjCRuntime"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSResponder", "NSView", "NSEvent", "NSGraphics", "NSRunningApplication"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
