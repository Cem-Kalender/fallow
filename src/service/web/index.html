<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fallow</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
<script src="/screens/dashboard.js" defer></script>
<script src="/screens/project.js" defer></script>
<script src="/screens/spec.js" defer></script>
<script src="/screens/loop.js" defer></script>
<script src="/screens/pipelines.js" defer></script>
</head>
<body>
<header class="top-bar">
  <a class="logo" href="#/" aria-label="Fallow dashboard">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M4 20c4-1 6-5 8-9s4-7 8-7"></path><path d="M4 14c3 0 5-2 6-4"></path><path d="M12 20c3-1 5-3 6-6"></path></svg>
    Fallow
  </a>
  <nav aria-label="Main" class="nav-links">
    <a class="nav" data-nav="dashboard" href="#/">Dashboard</a>
    <a class="nav" data-nav="spec" href="#/specs">Spec sessions</a>
    <a class="nav" data-nav="loop" href="#/loops">Loops</a>
    <a class="nav" data-nav="pipelines" href="#/pipelines">Pipelines &amp; agents</a>
  </nav>
  <div class="grow"></div>
  <span id="needs-count" class="pill orange" hidden></span>
  <span id="header-status" class="small muted"></span>
</header>
<div id="app" aria-live="polite"></div>
<dialog id="confirm" class="confirm" aria-labelledby="confirm-title">
  <form method="dialog">
    <h2 id="confirm-title"></h2>
    <p id="confirm-text" class="body-ink lh mt-8"></p>
    <ul id="confirm-list"></ul>
    <div class="row mt-16">
      <div class="grow"></div>
      <button class="btn btn2" value="cancel">Cancel</button>
      <button id="confirm-ok" class="btn" value="ok">Confirm</button>
    </div>
  </form>
</dialog>
</body>
</html>
