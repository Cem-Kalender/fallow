[package]
name = "fallow"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "Takes a coding task from an approved plan to a result it has verified itself"

[workspace]
resolver = "3"
members = [".", "xtask"]
exclude = ["spikes"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "display", "serde"] }
serde_json = "1"
globset = { version = "0.4", default-features = false }
regex = "1"
# The run page on loopback (006 research R-6).
tiny_http = "=0.12.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# 014: Fallow's own window through WebView2 (research R-1), on a window Fallow makes itself.
wry = "=0.57.2"
raw-window-handle = "0.6"
# 014: the WebView2 environment with Fallow's own options, and the events `wry` does not expose
# (research R-1, R-4, R-6). Both are already in the graph through `wry`, at these versions.
webview2-com = "=0.39.1"
windows-core = "0.62"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    # The notification icon (007 research S-14); Gdi for the window class's fields.
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # 014: the window's thread (OLE), its frame (DWM), Quit's task dialog, the desktop check and
    # the web view's processes (research R-2, R-7, R-9, R-13, R-15).
    "Win32_System_Ole",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_UI_HiDpi",
] }

[features]
# 014 (research R-15): the test build. Adds the loopback page (`service::http`) on Windows, where a
# release build has none, for the benchmarks and the tests that drive the Studio over HTTP. Never
# in a release.
automation = []

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# 014 (T005): tests of the loopback page itself, which a Windows release build does not have.
[[test]]
name = "service_http"
required-features = ["automation"]

[[test]]
name = "visual_009"
required-features = ["automation"]

[[test]]
name = "visual_010"
required-features = ["automation"]

[[test]]
name = "visual_013"
required-features = ["automation"]
