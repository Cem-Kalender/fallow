[package]
name = "fallow"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "Takes a coding task from an approved plan to a result it has verified itself"

[workspace]
resolver = "3"
members = [".", "xtask"]
exclude = ["spikes"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "display", "serde"] }
serde_json = "1"
globset = { version = "0.4", default-features = false }
regex = "1"
# The run page on loopback (006 research R-6).
tiny_http = "=0.12.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
