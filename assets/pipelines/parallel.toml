name = "parallel"
description = "Up to 3 builders on [P] tasks, each in its own working copy, the gates after every task and on each merged group, and a review alongside a security review at every user story's checkpoint"

[caps]
task_repairs = 3
review_rounds = 3
builders = 3

[[step]]
agent = "builder"
when = "task"
on_fail = "repair"

[[step]]
agent = "fallow:gates"
when = "task"
on_fail = "repair"

[[step]]
agent = "reviewer"
when = "checkpoint"
on_fail = "repair"
parallel_with = ["security-reviewer"]

[[step]]
agent = "security-reviewer"
when = "checkpoint"
on_fail = "repair"
