# CI for Fallow (tasks.md T025): format, lint, dependency policy, build, tests, and the
# constitution's benchmark gates on all three platforms (Principle VI, research R-13).
# The build fails if the startup (p95 < 100 ms), idle memory (< 50 MB RSS), loaded memory
# (< 150 MB RSS) or search time (first result, p95 < 1 s) budget is exceeded.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Dependency policy (licenses, bans)
        run: cargo deny check

      - name: Build (release)
        run: cargo build --release --locked

      - name: Tests
        run: cargo test --workspace --locked

      - name: Startup benchmark (50 remembered projects; p95 of 30 runs < 100 ms)
        run: cargo xtask bench-startup

      - name: Idle memory benchmark (50 remembered projects; peak RSS < 50 MB)
        run: cargo xtask bench-memory --idle --csv bench-memory-idle-${{ matrix.os }}.csv

      - name: Refresh CPU benchmark (~600 processes, <= 2% of one core)
        run: cargo xtask bench-refresh

      - name: New/exited process latency (<= two refresh intervals)
        run: cargo xtask bench-new-process

      - name: Sessions (002 SC-003 echo, SC-005 switch, SC-006 echo under flood)
        run: cargo xtask bench-sessions

      # The macOS run also dumps Fallow's memory with lldb, which needs sudo (as the canary).
      - name: Session canary (002 FR-026, output never leaves memory)
        run: cargo xtask canary --sessions

      # The reference large project (T082, R-13): ~50,000 files, ~1 GB, generated from fixed
      # seeds and cached by a hash of the generator.
      - name: Reference fixture cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fallow-fixture
          key: fallow-fixture-${{ runner.os }}-${{ hashFiles('xtask/src/gen_fixture.rs') }}

      - name: Reference fixture (generated unless cached)
        run: cargo xtask gen-fixture --out "$RUNNER_TEMP/fallow-fixture"

      - name: Loaded memory benchmark (large project + 4 flooding sessions; peak RSS < 150 MB)
        run: cargo xtask bench-memory --loaded --fixture "$RUNNER_TEMP/fallow-fixture" --csv bench-memory-loaded-${{ matrix.os }}.csv

      - name: Search time (first result row, p95 of 10 < 1 s)
        run: cargo xtask bench-search --fixture "$RUNNER_TEMP/fallow-fixture"

      - name: Unprivileged run (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          rm -rf /tmp/fallowci && mkdir -p /tmp/fallowci
          cp target/release/fallow target/release/xtask /tmp/fallowci/
          chmod 755 /tmp/fallowci /tmp/fallowci/*
          cd /tmp && sudo -u nobody /tmp/fallowci/xtask unprivileged --bin /tmp/fallowci/fallow

      - name: Unprivileged run (Windows, standard user)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $chars = [char[]]'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789'
          # 14 characters at most: longer passwords make `net user` prompt for confirmation.
          $pw = -join (1..10 | ForEach-Object { $chars | Get-Random }) + 'aA1!'
          net user fallowci $pw /add
          if ($LASTEXITCODE -ne 0) { throw 'could not create the fallowci user' }
          if ((net localgroup Administrators) -match 'fallowci') { throw 'fallowci must not be an administrator' }
          New-Item -ItemType Directory -Force C:\fallowci | Out-Null
          Copy-Item target\release\fallow.exe, target\release\xtask.exe C:\fallowci\
          icacls C:\fallowci /grant 'fallowci:(OI)(CI)RX' | Out-Null
          New-Item -ItemType Directory -Force C:\fallowci\work | Out-Null
          icacls C:\fallowci\work /grant 'fallowci:(OI)(CI)M' | Out-Null
          $cred = New-Object System.Management.Automation.PSCredential('fallowci', (ConvertTo-SecureString $pw -AsPlainText -Force))
          $out = "$env:RUNNER_TEMP\unpriv-out.txt"
          $err = "$env:RUNNER_TEMP\unpriv-err.txt"
          $p = Start-Process -FilePath C:\fallowci\xtask.exe -ArgumentList 'unprivileged','--bin','C:\fallowci\fallow.exe','--work-dir','C:\fallowci\work' `
            -Credential $cred -LoadUserProfile -WorkingDirectory C:\fallowci `
            -RedirectStandardOutput $out -RedirectStandardError $err -Wait -PassThru
          Get-Content $out, $err
          Add-Content $env:GITHUB_STEP_SUMMARY "### Unprivileged run (windows)"
          Get-Content $out | Add-Content $env:GITHUB_STEP_SUMMARY
          exit $p.ExitCode

      - name: Canary (SC-007, macOS)
        if: runner.os == 'macOS'
        run: cargo xtask canary

      - name: Upload RSS series
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-memory-${{ matrix.os }}
          path: |
            bench-memory-idle-${{ matrix.os }}.csv
            bench-memory-loaded-${{ matrix.os }}.csv
          if-no-files-found: warn
