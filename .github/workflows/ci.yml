# CI for Fallow (006 tasks T008, 007 T082): format, lint, dependency policy, build, the gates
# 007 names, the tests and the constitution VIII benchmarks, on Windows, the release target of
# 006 (clarified 2026-10-29).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: windows
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Dependency policy (licenses, bans)
        run: cargo deny check

      - name: Build
        run: cargo build --locked

      # The gates of 007 (tasks T082), each named so a failure says which promise broke.
      - name: "Gate: false claims and unverified results"
        run: cargo test --locked --test us2_false_claims --test us2_pipeline_steps

      - name: "Gate: reserved questions are relayed to the engineer"
        run: cargo test --locked --test us4_ask

      - name: "Gate: writes only where allowed (project install, discarded lead edits)"
        run: cargo test --locked --test us1_projects --test us1_conversation

      - name: "Gate: the page on the loopback only, to the engineer only"
        run: cargo test --locked --test service_http

      - name: "Gate: loops resume after a restart"
        run: cargo test --locked --test us2_resume

      - name: "Gate: run records hold no text (marker test)"
        run: cargo test --locked --test record_marker

      - name: Tests (agents are the scripted fake agent; no network, no cost)
        run: cargo test --workspace --locked

      - name: "Benchmarks: page ready, idle and running memory (constitution VIII)"
        run: cargo xtask bench
