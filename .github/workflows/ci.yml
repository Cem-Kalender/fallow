# CI for Fallow (006 tasks T008): format, lint, dependency policy, build and tests on Windows,
# the release target of 006 (clarified 2026-10-29). The constitution VIII benchmarks and the
# egress test join this workflow with 006's polish phase (T074, T075).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: windows
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Dependency policy (licenses, bans)
        run: cargo deny check

      - name: Build
        run: cargo build --locked

      - name: Tests (agents are the scripted fake agent; no network, no cost)
        run: cargo test --workspace --locked
